name: Build macOS

on:
  push:
    branches: [main, develop]

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon runner; produces universal arm64+x86_64 binary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # GLFW 3.4 — built from source so we control the deployment target.
      # Homebrew's pre-built bottle targets the runner OS (macOS 14), which
      # would brand our binary with minos=14.0 and prevent it running on
      # Monterey/Ventura. Building from source with MACOSX_DEPLOYMENT_TARGET
      # and CMAKE_OSX_ARCHITECTURES gives a universal static lib at 12.0.
      # ------------------------------------------------------------------
      - name: Cache GLFW
        id: glfw-cache
        uses: actions/cache@v4
        with:
          path: glfw-install
          key: glfw-3.4-macos-universal-12.0-v1

      - name: Build GLFW from source
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o glfw.tar.gz \
            https://github.com/glfw/glfw/archive/refs/tags/3.4.tar.gz
          tar xzf glfw.tar.gz
          cmake -S glfw-3.4 -B glfw-3.4/build \
            -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_TESTS=OFF \
            -DGLFW_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/glfw-install
          cmake --build glfw-3.4/build -j$(sysctl -n hw.ncpu)
          cmake --install glfw-3.4/build

      # ------------------------------------------------------------------
      # MuPDF 1.24.11 — built from source for both arm64 and x86_64, then
      # combined with lipo into universal static libraries.
      # Cache key updated to reflect universal+deployment-target change.
      # ------------------------------------------------------------------
      - name: Cache MuPDF
        id: mupdf-cache
        uses: actions/cache@v4
        with:
          path: mupdf-libs-macos
          key: mupdf-1.24.11-macos-universal-12.0-v1

      - name: Build MuPDF from source
        if: steps.mupdf-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o mupdf-source.tar.gz \
            https://mupdf.com/downloads/archive/mupdf-1.24.11-source.tar.gz
          tar xzf mupdf-source.tar.gz
          cd mupdf-1.24.11-source

          # --- arm64 ---
          make HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no build=release libs \
               -j$(sysctl -n hw.ncpu) \
               XCFLAGS="-arch arm64 -mmacosx-version-min=12.0"
          mkdir -p ../mupdf-arm64
          cp build/release/libmupdf.a build/release/libmupdf-third.a \
             ../mupdf-arm64/

          # --- x86_64 (clean between archs) ---
          rm -rf build
          make HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no build=release libs \
               -j$(sysctl -n hw.ncpu) \
               XCFLAGS="-arch x86_64 -mmacosx-version-min=12.0"
          mkdir -p ../mupdf-x86_64
          cp build/release/libmupdf.a build/release/libmupdf-third.a \
             ../mupdf-x86_64/

          # --- combine into universal fat archives ---
          mkdir -p ../mupdf-libs-macos
          lipo -create ../mupdf-arm64/libmupdf.a ../mupdf-x86_64/libmupdf.a \
               -output ../mupdf-libs-macos/libmupdf.a
          lipo -create ../mupdf-arm64/libmupdf-third.a ../mupdf-x86_64/libmupdf-third.a \
               -output ../mupdf-libs-macos/libmupdf-third.a

      - name: Install MuPDF libs
        run: |
          mkdir -p scholion/third_party/mupdf/lib
          cp mupdf-libs-macos/libmupdf.a mupdf-libs-macos/libmupdf-third.a \
             scholion/third_party/mupdf/lib/

      # ------------------------------------------------------------------
      # Build Scholion.app — universal binary, deployment target 12.0.
      # CMAKE_PREFIX_PATH points to the locally-built GLFW (not Homebrew).
      # ------------------------------------------------------------------
      - name: Configure
        run: |
          cmake -S scholion -B scholion/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCHOLION_WITH_MUPDF=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/glfw-install

      - name: Build
        run: cmake --build scholion/build -j$(sysctl -n hw.ncpu)

      # ------------------------------------------------------------------
      # Verify the binary is actually universal before packaging.
      # ------------------------------------------------------------------
      - name: Verify universal binary
        run: |
          lipo -info scholion/build/Scholion.app/Contents/MacOS/Scholion
          echo "Deployment target:"
          otool -l scholion/build/Scholion.app/Contents/MacOS/Scholion \
            | grep -A3 'LC_BUILD_VERSION' | head -12

      # ------------------------------------------------------------------
      # Package as DMG
      # ------------------------------------------------------------------
      - name: Create DMG
        run: |
          mkdir -p scholion/build/dmg_stage
          cp -r scholion/build/Scholion.app scholion/build/dmg_stage/
          ln -s /Applications scholion/build/dmg_stage/Applications
          hdiutil create \
            -volname "Scholion" \
            -srcfolder scholion/build/dmg_stage \
            -ov -format UDZO \
            scholion/build/Scholion.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Scholion-macOS-universal
          path: scholion/build/Scholion.dmg
          retention-days: 30

      # ------------------------------------------------------------------
      # Publish to GitHub Releases on version tags (e.g. v0.6.0)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: scholion/build/Scholion.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
