name: Build macOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon (arm64) — matches the bundled MuPDF libs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GLFW
        run: brew install glfw

      # ------------------------------------------------------------------
      # MuPDF 1.24.11 — built from source, cached by version key.
      # Cache hit: skip the ~4-minute source build on subsequent runs.
      # ------------------------------------------------------------------
      - name: Cache MuPDF
        id: mupdf-cache
        uses: actions/cache@v4
        with:
          path: mupdf-libs-macos
          key: mupdf-1.24.11-macos-arm64-v1

      - name: Build MuPDF from source
        if: steps.mupdf-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o mupdf-source.tar.gz \
            https://mupdf.com/downloads/archive/mupdf-1.24.11-source.tar.gz
          tar xzf mupdf-source.tar.gz
          cd mupdf-1.24.11-source
          make HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no build=release libs \
               -j$(sysctl -n hw.ncpu)
          mkdir -p ../mupdf-libs-macos
          cp build/release/libmupdf.a build/release/libmupdf-third.a \
             ../mupdf-libs-macos/

      - name: Install MuPDF libs
        run: |
          cp mupdf-libs-macos/libmupdf.a mupdf-libs-macos/libmupdf-third.a \
             scholion/third_party/mupdf/lib/

      # ------------------------------------------------------------------
      # Build Scholion.app
      # ------------------------------------------------------------------
      - name: Configure
        run: |
          cmake -S scholion -B scholion/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCHOLION_WITH_MUPDF=ON

      - name: Build
        run: cmake --build scholion/build -j$(sysctl -n hw.ncpu)

      # ------------------------------------------------------------------
      # Package as DMG
      # ------------------------------------------------------------------
      - name: Create DMG
        run: |
          mkdir -p scholion/build/dmg_stage
          cp -r scholion/build/Scholion.app scholion/build/dmg_stage/
          # Applications symlink for drag-to-install UX
          ln -s /Applications scholion/build/dmg_stage/Applications
          hdiutil create \
            -volname "Scholion" \
            -srcfolder scholion/build/dmg_stage \
            -ov -format UDZO \
            scholion/build/Scholion.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Scholion-macOS-arm64
          path: scholion/build/Scholion.dmg
          retention-days: 30

      # ------------------------------------------------------------------
      # Publish to GitHub Releases on version tags (e.g. v0.6.0)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: scholion/build/Scholion.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
