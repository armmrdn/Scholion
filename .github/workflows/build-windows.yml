name: Build Windows

on:
  push:
    branches: [main, develop]
    tags:     ['v*']

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write   # needed to create/update GitHub Releases
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # MSYS2 / MinGW-w64 toolchain
      # All compilation steps use  shell: msys2 {0}  below.
      # ------------------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: minimal
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config
            make

      # ------------------------------------------------------------------
      # MuPDF 1.24.11 — built from source, cached by version key.
      # Cache hit: skip the ~6-minute source build on subsequent runs.
      # ------------------------------------------------------------------
      - name: Cache MuPDF
        id: mupdf-cache
        uses: actions/cache@v4
        with:
          path: mupdf-libs-windows
          key: mupdf-1.24.11-windows-mingw64-v1

      - name: Build MuPDF from source
        if: steps.mupdf-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          curl -L -o mupdf-source.tar.gz \
            https://mupdf.com/downloads/archive/mupdf-1.24.11-source.tar.gz
          # Windows can't create symlinks without Developer Mode; harfbuzz/README
          # is a symlink we don't need — ignore the error and verify the Makefile.
          tar xzf mupdf-source.tar.gz || true
          [ -f mupdf-1.24.11-source/Makefile ] || { echo "Extraction failed"; exit 1; }
          cd mupdf-1.24.11-source
          # XCFLAGS: GCC 14 promotes -Wincompatible-pointer-types to a hard error;
          # MuPDF 1.24.11 has a _wstat/_stat64i32 mismatch on Windows.
          make HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no build=release libs -j4 \
               XCFLAGS="-Wno-incompatible-pointer-types"
          mkdir -p ../mupdf-libs-windows
          cp build/release/libmupdf.a build/release/libmupdf-third.a \
             ../mupdf-libs-windows/

      - name: Install MuPDF libs
        shell: msys2 {0}
        run: |
          cp mupdf-libs-windows/libmupdf.a mupdf-libs-windows/libmupdf-third.a \
             scholion-win/third_party/mupdf/lib/

      # ------------------------------------------------------------------
      # Build Scholion.exe
      # ------------------------------------------------------------------
      - name: Configure
        shell: msys2 {0}
        run: |
          SCHOLION_DEV_FLAG=""
          if [ "${{ github.ref_name }}" = "develop" ]; then
            SCHOLION_DEV_FLAG="-DSCHOLION_DEV=ON"
          fi
          cmake -S scholion-win -B scholion-win/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCHOLION_WITH_MUPDF=ON \
            $SCHOLION_DEV_FLAG

      - name: Build
        shell: msys2 {0}
        run: cmake --build scholion-win/build

      # ------------------------------------------------------------------
      # Bundle: exe + all MinGW DLLs it depends on.
      # ldd filters to /mingw64 paths; Windows system DLLs are excluded.
      # The result is a self-contained folder — extract and run.
      # ------------------------------------------------------------------
      - name: Bundle
        shell: msys2 {0}
        run: |
          mkdir -p Scholion-Windows
          cp scholion-win/build/Scholion.exe Scholion-Windows/
          ldd scholion-win/build/Scholion.exe \
            | grep '/mingw64' \
            | awk '{print $3}' \
            | xargs -I{} cp {} Scholion-Windows/
          echo "--- Bundle contents ---"
          ls -lh Scholion-Windows/

      # Compress-Archive is built into PowerShell on all Windows runners.
      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path Scholion-Windows\* -DestinationPath Scholion-Windows.zip

      # ------------------------------------------------------------------
      # Upload artifact — delete any previous same-named artifact first so
      # storage never accumulates. 1-day retention as a safety net.
      # ------------------------------------------------------------------
      - name: Delete previous artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/armmrdn/Scholion/actions/artifacts?name=Scholion-Windows-main&per_page=100" \
              --jq '.artifacts[].id' 2>/dev/null); do
            gh api --method DELETE "repos/armmrdn/Scholion/actions/artifacts/$id" 2>/dev/null || true
          done

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Scholion-Windows-main
          path: Scholion-Windows.zip
          retention-days: 1
