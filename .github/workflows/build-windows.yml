name: Build Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies with vcpkg
      run: |
        vcpkg integrate install
        vcpkg install glfw3:x64-windows curl:x64-windows
      shell: pwsh

    - name: Verify MuPDF libraries exist
      run: |
        if (!(Test-Path "scholion-win/third_party/mupdf/lib/mupdf.lib")) {
          Write-Error "MuPDF library not found at scholion-win/third_party/mupdf/lib/mupdf.lib"
          exit 1
        }
        if (!(Test-Path "scholion-win/third_party/mupdf/lib/mupdf-third.lib")) {
          Write-Error "MuPDF-third library not found at scholion-win/third_party/mupdf/lib/mupdf-third.lib"
          exit 1
        }
        Write-Host "✓ MuPDF libraries verified"
      shell: pwsh

    - name: Configure build with CMake
      run: |
        cd scholion-win
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DSCHOLION_WITH_MUPDF=ON
      shell: pwsh

    - name: Build Scholion.exe
      run: |
        cd scholion-win/build
        cmake --build . --config Release -j 4
      shell: pwsh

    - name: Copy runtime DLLs
      run: |
        $releaseDir = "scholion-win/build/Release"
        $vcpkgInstalled = "C:/vcpkg/installed/x64-windows/bin"

        # Create release directory if it doesn't exist
        if (!(Test-Path $releaseDir)) {
          mkdir -p $releaseDir
        }

        # Copy GLFW DLL
        if (Test-Path "$vcpkgInstalled/glfw3.dll") {
          Copy-Item "$vcpkgInstalled/glfw3.dll" "$releaseDir/" -Force
          Write-Host "✓ Copied glfw3.dll"
        }

        # Copy libcurl DLL and dependencies
        if (Test-Path "$vcpkgInstalled/libcurl.dll") {
          Copy-Item "$vcpkgInstalled/libcurl.dll" "$releaseDir/" -Force
          Write-Host "✓ Copied libcurl.dll"
        }

        # Copy OpenSSL DLLs (required by curl)
        if (Test-Path "$vcpkgInstalled/libssl-3-x64.dll") {
          Copy-Item "$vcpkgInstalled/libssl-3-x64.dll" "$releaseDir/" -Force
          Write-Host "✓ Copied libssl-3-x64.dll"
        }
        if (Test-Path "$vcpkgInstalled/libcrypto-3-x64.dll") {
          Copy-Item "$vcpkgInstalled/libcrypto-3-x64.dll" "$releaseDir/" -Force
          Write-Host "✓ Copied libcrypto-3-x64.dll"
        }

        # Copy zlib (required by libcurl)
        if (Test-Path "$vcpkgInstalled/zlib1.dll") {
          Copy-Item "$vcpkgInstalled/zlib1.dll" "$releaseDir/" -Force
          Write-Host "✓ Copied zlib1.dll"
        }

        Write-Host ""
        Write-Host "Release directory contents:"
        ls -la $releaseDir
      shell: pwsh

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: Scholion-Windows
        path: scholion-win/build/Release/
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: scholion-win/build/Release/Scholion.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
