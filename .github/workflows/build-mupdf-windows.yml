name: Build MuPDF Windows Libraries

on:
  workflow_dispatch

jobs:
  build-mupdf:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download MuPDF source
      run: |
        curl -L -o mupdf-1.27.2-source.tar.lz https://mupdf.com/downloads/mupdf-1.27.2-source.tar.lz
        tar -xf mupdf-1.27.2-source.tar.lz
      shell: powershell

    - name: Create MuPDF build directory
      run: |
        cd mupdf-1.27.2-source
        mkdir build
      shell: powershell

    - name: Configure MuPDF with CMake
      run: |
        cd mupdf-1.27.2-source\build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: powershell

    - name: Build MuPDF
      run: |
        cd mupdf-1.27.2-source\build
        cmake --build . --config Release -j 8
      shell: powershell

    - name: Copy .lib files to scholion-win
      run: |
        $src = "mupdf-1.27.2-source\build\Release"
        $dest = "scholion-win\third_party\mupdf\lib"
        mkdir -p $dest -ErrorAction SilentlyContinue
        copy "$src\mupdf.lib" "$dest\" -Force
        copy "$src\mupdf-third.lib" "$dest\" -Force
        echo "Files copied:"
        ls -l $dest\*.lib
      shell: powershell

    - name: Configure git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "github-actions[bot]"
      shell: powershell

    - name: Commit and push .lib files
      run: |
        git add scholion-win/third_party/mupdf/lib/mupdf.lib scholion-win/third_party/mupdf/lib/mupdf-third.lib
        git commit -m "Add MuPDF 1.27.2 Windows prebuilt libraries

Co-Authored-By: GitHub Actions <actions@github.com>"
        git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" push origin HEAD:${{ github.ref }}
      shell: powershell
